<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 场景预览</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #c0c3ca;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }

      /* 控制面板 */
      .panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        z-index: 10;
        align-items: center;
      }
      .panel-hint {
        font-size: 0.72rem;
        color: rgba(0, 0, 0, 0.35);
        margin-right: 4px;
        white-space: nowrap;
      }
      .mat-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1.5px solid rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.04);
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.7rem;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.5);
      }
      .mat-btn:hover {
        border-color: rgba(79, 70, 229, 0.6);
        background: rgba(79, 70, 229, 0.1);
        color: #4f46e5;
      }
      .mat-btn.active {
        border-color: #4f46e5;
        background: rgba(79, 70, 229, 0.15);
        color: #4f46e5;
      }

      /* 顶部标签 */
      .top-bar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .tag {
        padding: 4px 14px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 30px;
        font-size: 0.72rem;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.45);
      }
      .tag.live {
        border-color: rgba(16, 185, 129, 0.4);
      }
      .tag.live::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        background: #10b981;
        border-radius: 50%;
        margin-right: 5px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* 加载状态 */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #c0c3ca;
        z-index: 100;
        gap: 16px;
        transition: opacity 0.5s;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(79, 70, 229, 0.15);
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading p {
        font-size: 0.85rem;
        color: rgba(0, 0, 0, 0.4);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loading p {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>加载模型中...</p>
    </div>

    <div id="app"></div>

    <div class="top-bar">
      <span class="tag live">GLB 预览</span>
      <span class="tag">拖拽旋转 · 滚轮缩放</span>
    </div>

    <div class="panel">
      <input type="file" id="fileInput" accept=".glb,.gltf" style="display:none">
      <button class="mat-btn" id="loadBtn" title="加载本地模型">📂</button>
      <span class="panel-hint">物料切换</span>
      <button
        class="mat-btn active"
        data-color="#e0e7ff"
        data-name="默认"
        title="默认白色"
      >
        白
      </button>
      <button
        class="mat-btn"
        data-color="#1e3a5f"
        data-name="深蓝"
        title="深蓝"
      >
        深蓝
      </button>
      <button
        class="mat-btn"
        data-color="#064e3b"
        data-name="翠绿"
        title="翠绿"
      >
        绿
      </button>
      <button
        class="mat-btn"
        data-color="#7c2d12"
        data-name="赤褐"
        title="赤褐"
      >
        红
      </button>
      <button
        class="mat-btn"
        data-color="#1e1b4b"
        data-name="靛紫"
        title="靛紫"
      >
        紫
      </button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      // 获取URL参数
      const params = new URLSearchParams(location.search);
      const modelFile = params.get("model") || "living_room_poof_v230223.glb";

      let scene, camera, renderer, controls;
      let model = null;
      const defaultColors = [];
      const loader = new GLTFLoader(); // 提升到全局作用域

      // 场景初始化
      function init() {
        const container = document.getElementById("app");

        // 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color("#c0c3ca");

        // 相机
        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.set(5, 3, 6);

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 控制器
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0.5, 0);

        // 光照
        setupLights();

        // 加载模型
        loadModel();

        // 事件
        window.addEventListener("resize", onResize);
        setupMaterialButtons();

        // 动画
        animate();
      }

      function setupLights() {
        // 环境光（亮一些）
        const ambient = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambient);

        // 主方向光
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // 补光（偏暖）
        const fillLight = new THREE.DirectionalLight(0xfff5e0, 0.6);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        // 半球光（天空/地面）
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xf0f0f0, 0.5);
        scene.add(hemiLight);
      }

      function loadModel() {
        // 直接加载模型文件（需要服务器环境，或使用左上角📂按钮选择文件）
        loader.load(
          modelFile,
          (gltf) => {
            model = gltf.scene;

            // 居中和缩放
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 4 / maxDim;
            model.scale.setScalar(scale);
            model.position.sub(center.multiplyScalar(scale));
            model.position.y = 0;

            // 收集所有材质颜色
            model.traverse((child) => {
              if (child.isMesh && child.material) {
                if (Array.isArray(child.material)) {
                  child.material.forEach((m) => {
                    if (m.color) defaultColors.push(m.color.getHex());
                  });
                } else if (child.material.color) {
                  defaultColors.push(child.material.color.getHex());
                }
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            scene.add(model);
            document.getElementById("loading").classList.add("hidden");
          },
          (xhr) => {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            const p = document.querySelector("#loading p");
            if (p) p.textContent = `加载中... ${pct}%`;
          },
          (err) => {
            console.error("Model load error:", err);
            document.getElementById("loading").classList.add("hidden");
          }
        );
      }

      function setupMaterialButtons() {
        const buttons = document.querySelectorAll(".mat-btn");
        buttons.forEach((btn) => {
          btn.addEventListener("click", () => {
            buttons.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const hex = btn.dataset.color;
            const color = new THREE.Color(hex);

            if (model) {
              model.traverse((child) => {
                if (child.isMesh && child.material) {
                  const applyMat = (m) => {
                    if (m.color && m.color.getHex() !== 0x000000) {
                      m.color.set(color);
                      m.emissive?.set(0x000000);
                    }
                  };
                  if (Array.isArray(child.material)) {
                    child.material.forEach(applyMat);
                  } else {
                    applyMat(child.material);
                  }
                  child.material.needsUpdate = true;
                }
              });
            }
          });
        });

        // 文件选择功能
        const fileInput = document.getElementById('fileInput');
        const loadBtn = document.getElementById('loadBtn');
        loadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const url = URL.createObjectURL(file);
            loadModelFromURL(loader, url);
          }
        });
      }

      function loadModelFromURL(loader, url) {
        // 移除旧模型
        if (model) {
          scene.remove(model);
          model.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) {
                child.material.forEach(m => m.dispose());
              } else {
                child.material.dispose();
              }
            }
          });
        }

        loader.load(
          url,
          (gltf) => {
            model = gltf.scene;

            // 居中和缩放
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 4 / maxDim;
            model.scale.setScalar(scale);
            model.position.sub(center.multiplyScalar(scale));
            model.position.y = 0;

            // 收集所有材质颜色
            defaultColors.length = 0;
            model.traverse((child) => {
              if (child.isMesh && child.material) {
                if (Array.isArray(child.material)) {
                  child.material.forEach((m) => {
                    if (m.color) defaultColors.push(m.color.getHex());
                  });
                } else if (child.material.color) {
                  defaultColors.push(child.material.color.getHex());
                }
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            scene.add(model);
            document.getElementById("loading").classList.add("hidden");
          },
          (xhr) => {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            const p = document.querySelector("#loading p");
            if (p) p.textContent = `加载中... ${pct}%`;
          },
          (err) => {
            console.error("Model load error:", err);
            document.getElementById("loading").classList.add("hidden");
          }
        );
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      init();
    </script>
  </body>
</html>
